<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="utf-8">
<script>document.documentElement.classList.add("js")</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>404 – formeur</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E8ECEC; --surface:#F4F6F6; --ink:#17232B; --muted:#5A6A72; --line:#B9C4C8;
  --accent:#2B3FD6; --accent-ink:#FFFFFF; --tint:#CDD3F7;
  --display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --body:"Instrument Sans","Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#10181D;--surface:#18232A;--ink:#E7EDEF;--muted:#93A4AC;--line:#2E3E47;--accent:#8E9CFF;--accent-ink:#10181D;--tint:#26305E}
}
:root[data-theme="dark"]{--bg:#10181D;--surface:#18232A;--ink:#E7EDEF;--muted:#93A4AC;--line:#2E3E47;--accent:#8E9CFF;--accent-ink:#10181D;--tint:#26305E}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--bg);overscroll-behavior:none}
body{margin:0;min-height:100vh;min-height:100svh;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font:400 1.0625rem/1.6 var(--body);-webkit-font-smoothing:antialiased;overflow-x:hidden;overflow-x:clip}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:100;opacity:.07;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>")}
a{color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
p{margin:0}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px;width:100%}
header .wrap{display:flex;justify-content:space-between;align-items:center;gap:16px;padding-top:calc(24px + env(safe-area-inset-top,0px));padding-bottom:24px}
.logo{display:inline-flex;text-decoration:none;color:var(--ink)}
.logo>svg{height:35px;width:auto;aspect-ratio:1930/180;display:block;flex:none}
.mark{fill:var(--accent)}
.wm{fill:none;stroke:currentColor;stroke-width:25;stroke-linejoin:miter}
.tg{fill:none;stroke:currentColor;stroke-width:22;stroke-linejoin:miter}
.lang{display:flex;gap:2px}
.lang button{appearance:none;background:none;border:0;padding:6px 8px;font:600 .78rem var(--body);letter-spacing:.14em;color:var(--muted);cursor:pointer;border-radius:8px;transition:color .25s,background .25s}
.lang button:hover{color:var(--ink)}
.lang button[aria-pressed="true"]{color:var(--ink);background:color-mix(in srgb,var(--ink) 8%,transparent)}
main{flex:1;position:relative;isolation:isolate;display:flex;align-items:center;padding:clamp(24px,6vh,72px) 0 clamp(72px,12vh,140px)}
main::before{content:"";position:absolute;top:-25%;left:calc(50% - 60vw);width:120vw;height:140%;z-index:-2;background:radial-gradient(40% 50% at 22% 30%,color-mix(in srgb,var(--accent) 24%,transparent),transparent 70%),radial-gradient(35% 45% at 82% 62%,color-mix(in srgb,var(--tint) 95%,transparent),transparent 70%);will-change:transform;animation:drift 18s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate3d(4%,6%,0) scale(1.08)}}
.door{position:absolute;right:24px;bottom:40px;width:clamp(220px,32vw,460px);aspect-ratio:1;z-index:-1;pointer-events:none}
.door svg{width:100%;height:100%;overflow:visible;fill:none}
.door .wall{stroke:var(--ink);stroke-width:2}
.door .sector{fill:var(--accent);fill-opacity:0;animation:sec 2.6s cubic-bezier(.65,0,.25,1) .5s both}
.door .leaf{stroke:var(--accent);stroke-width:7;transform-origin:380px 380px;animation:open 2.6s cubic-bezier(.65,0,.25,1) .5s both}
@keyframes open{from{transform:rotate(0)}to{transform:rotate(90deg)}}
@keyframes sec{to{fill-opacity:.08}}
.code{display:flex;align-items:baseline}
.code-mark{flex:none;width:.75em;height:.75em;margin:0 .05em;fill:var(--accent)}
.eyebrow{display:flex;align-items:center;gap:14px;margin-bottom:22px;font:600 .8rem/1 var(--body);letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}
.eyebrow::before{content:"";width:32px;height:1px;background:currentColor}
.code{margin:0 0 clamp(16px,3vh,28px);font:300 clamp(5rem,18vw,13rem)/.85 var(--display);font-stretch:125%;letter-spacing:-.05em;color:var(--accent)}
h1{margin:0;font:300 clamp(1.9rem,4.6vw,3.6rem)/1.08 var(--display);font-stretch:125%;letter-spacing:-.035em;max-width:16ch}
.lead{margin:clamp(16px,3vh,28px) 0 clamp(24px,4vh,36px);font-size:1.2rem;line-height:1.55;max-width:46ch;color:var(--muted)}
.cta{display:flex;gap:12px;flex-wrap:wrap}
.btn{position:relative;overflow:hidden;display:inline-block;background:var(--accent);color:var(--accent-ink);font:600 1rem var(--body);padding:14px 24px;border:0;border-radius:999px;text-decoration:none;box-shadow:0 10px 30px -14px var(--accent);transition:transform .35s cubic-bezier(.2,.7,.2,1),box-shadow .35s}
.btn::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.45) 50%,transparent 70%);transform:translateX(-120%);transition:transform .7s}
.btn:hover{transform:translateY(-2px);box-shadow:0 18px 34px -14px var(--accent)}
.btn:hover::after{transform:translateX(120%)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.btn.ghost:hover{box-shadow:inset 0 0 0 1.5px var(--ink)}
footer{--ink:#E8ECEC;--accent:#8E9CFF;--muted:#93A4AC;background:#0B1217;color:var(--muted);padding:40px 0 calc(40px + env(safe-area-inset-bottom,0px));font-size:.9rem}
footer .wrap{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
footer .logo>svg{height:26px}
@media(max-width:820px){.door{width:58vw;bottom:16px;opacity:.5}.logo>svg{height:auto;width:min(300px,calc(100vw - 140px))}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.door .leaf{transform:rotate(90deg)}.door .sector{fill-opacity:.08}}
/* Úvodná animácia loga */
.js header .logo>svg:not(.ready){visibility:hidden}
.lg-sweep{stroke-dasharray:100;stroke-dashoffset:100;animation:lgsweep .75s cubic-bezier(.65,0,.25,1) .1s forwards}
.lg-leaf{fill:none;stroke:var(--bg);stroke-width:5;transform-box:view-box;transform-origin:158px 158px;animation:lgleaf .75s cubic-bezier(.65,0,.25,1) .1s forwards}
.lg-rest{animation:lgrest .9s cubic-bezier(.16,1,.3,1) .9s both}
@keyframes lgsweep{to{stroke-dashoffset:0}}
@keyframes lgleaf{0%{transform:rotate(0);opacity:1}80%{opacity:1}100%{transform:rotate(90deg);opacity:0}}
@keyframes lgrest{from{transform:translateX(-1500px);opacity:0}12%{opacity:1}to{transform:none;opacity:1}}
@media(prefers-reduced-motion:reduce){.lg-sweep{animation:none;stroke-dashoffset:0}.lg-leaf{display:none}.lg-rest{animation:none}}
/* Plynulý nábeh obsahu */
.js .rise{opacity:0}
.go .rise{animation:heroRise 1.3s cubic-bezier(.16,1,.3,1) both;will-change:transform,opacity}
.go .eyebrow.rise{animation-delay:.15s}
.go .code.rise{animation-delay:.3s}
.go h1.rise{animation-delay:.45s}
.go .lead.rise{animation-delay:.6s}
.go .cta.rise{animation-delay:.75s}
@keyframes heroRise{from{opacity:0;transform:translateY(56px)}to{opacity:1;transform:none}}
.js .code-mark .lg-sweep,.js .code-mark .lg-leaf{animation:none}
.js .code-mark .lg-leaf{opacity:0}
.go .code-mark .lg-sweep{animation:lgsweep .75s cubic-bezier(.65,0,.25,1) 1s forwards}
.go .code-mark .lg-leaf{animation:lgleaf .75s cubic-bezier(.65,0,.25,1) 1s forwards}
.js footer .wrap>*{opacity:0;transform:translateY(36px);transition:opacity 1.1s cubic-bezier(.16,1,.3,1),transform 1.1s cubic-bezier(.16,1,.3,1)}
.js footer .wrap>*:nth-child(2){transition-delay:.18s}
.js footer.in .wrap>*{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){.js .rise,.js footer .wrap>*{opacity:1;transform:none}}
</style>
</head>
<body>

 282"/></g><path transform="translate(1213 0)" d="M434 327V217M434 278C462 248 495 229 542 230"/><use href="#fm-e" x="976"/><path transform="translate(1971 0)" d="M137 240C120 224 90 226 70 226C35 226 13 240 13 255C13 285 137 262 137 295C137 310 110 318 78 318C45 318 25 312 13 300"/><use href="#fm-e" x="1342"/><use href="#fm-n" x="1342"/><path transform="translate(2515 0)" d="M147 250C140 232 115 226 80 226C38 226 13 244 13 272C13 300 38 318 80 318C115 318 140 312 147 294"/><use href="#fm-e" x="1896"/></g></symbol></defs></svg>
<header><div class="wrap">
  <a class="logo" href="/" aria-label="Formeur – domov"><svg viewBox="0 0 1930 180" aria-hidden="true"><use href="#fm-logo" width="1440" height="166"/><svg x="1459" y="30.2" width="442" height="80.5" viewBox="0 164 1340 244" style="color:var(--muted)"><use href="#fm-tagg"/></svg><svg x="1459" y="96.2" width="467" height="80.5" viewBox="1456 164 1415 244" style="color:var(--muted)"><use href="#fm-tagg"/></svg></svg></a>

<main>
  <div class="door" aria-hidden="true"><svg viewBox="0 0 400 400"><path class="sector" d="M380 380H40A340 340 0 0 1 380 40Z"/><path class="wall" d="M0 380H380V0"/><path class="leaf" d="M380 380H40"/></svg></div>
  <div class="wrap">
    <p class="eyebrow rise" data-sk="Chyba" data-en="Error">Chyba</p>
    <p class="code rise" role="img" aria-label="404"><span aria-hidden="true">4</span><svg class="code-mark" viewBox="0 0 158 158" aria-hidden="true"><defs><mask id="cm-mask" maskUnits="userSpaceOnUse" x="-10" y="-10" width="180" height="180"><path class="lg-sweep" d="M43 158A115 115 0 0 1 158 43" pathLength="100" fill="none" stroke="#fff" stroke-width="236"/></mask></defs><g mask="url(#cm-mask)"><path class="mark" d="M158 0V158H0V95A95 95 0 0 1 95 0Z"/></g><path class="lg-leaf" d="M158 158H0"/></svg><span aria-hidden="true">4</span></p>
    <h1 class="rise" data-sk="Tieto dvere nikam nevedú" data-en="This door leads nowhere">Tieto dvere nikam nevedú</h1>

<script>
(function(){
  var T={sk:document.title,en:'404 – formeur'};
  function setLang(l){
    document.documentElement.lang=l;document.title=T[l];
    document.querySelectorAll('[data-sk]').forEach(function(e){e.textContent=e.getAttribute('data-'+l)});
    document.querySelectorAll('.lang button').forEach(function(b){b.setAttribute('aria-pressed',String(b.getAttribute('data-l')===l))});
    try{localStorage.setItem('fm-lang',l)}catch(e){}
  }
  document.querySelectorAll('.lang button').forEach(function(b){b.addEventListener('click',function(){setLang(b.getAttribute('data-l'))})});
  var s=null;try{s=localStorage.getItem('fm-lang')}catch(e){}
  if(s==='en')setLang('en');
})();
(function(){
    var svg=document.querySelector('header .logo>svg'),sym=document.getElementById('fm-logo');
    if(!svg||!sym||!sym.querySelector('.mark')||!sym.querySelector('.wm')){if(svg)svg.classList.add('ready');return}
    var NS='http://www.w3.org/2000/svg';
    function el(n,a){var e=document.createElementNS(NS,n);for(var k in a)e.setAttribute(k,a[k]);return e}
    var tags=[].slice.call(svg.querySelectorAll('svg'));
    var markD=sym.querySelector('.mark').getAttribute('d');
    var wm=sym.querySelector('.wm').cloneNode(true);
    while(svg.firstChild)svg.removeChild(svg.firstChild);
    var defs=el('defs',{}),cp=el('clipPath',{id:'lg-clip'});
    cp.appendChild(el('rect',{x:166,y:-10,width:2100,height:200}));
    var mk=el('mask',{id:'lg-mask',maskUnits:'userSpaceOnUse',x:-10,y:-10,width:180,height:180});
    mk.appendChild(el('path',{'class':'lg-sweep',d:'M43 158A115 115 0 0 1 158 43',pathLength:100,fill:'none',stroke:'#fff','stroke-width':236}));
    defs.appendChild(cp);defs.appendChild(mk);svg.appendChild(defs);
    var g=el('g',{transform:'translate(0,2)'}),mg=el('g',{mask:'url(#lg-mask)'});
    mg.appendChild(el('path',{'class':'mark',d:markD}));
    g.appendChild(mg);g.appendChild(el('path',{'class':'lg-leaf',d:'M158 158H0'}));
    svg.appendChild(g);
    var wrap=el('g',{'clip-path':'url(#lg-clip)'}),rest=el('g',{'class':'lg-rest'}),wg=el('g',{transform:'translate(0,-168)'});
    wg.appendChild(wm);rest.appendChild(wg);tags.forEach(function(t){rest.appendChild(t)});
    wrap.appendChild(rest);svg.appendChild(wrap);
    svg.classList.add('ready');
  })();
(function(){var go=function(){document.documentElement.classList.add('go')};
  if(document.fonts&&document.fonts.ready&&window.Promise){Promise.race([document.fonts.ready,new Promise(function(r){setTimeout(r,1500)})]).then(go)}else{go()}})();
(function(){var f=document.querySelector('footer');if(!f)return;
  if(!('IntersectionObserver' in window)){f.classList.add('in');return}
  var o=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){f.classList.add('in');o.disconnect()}})},{threshold:0,rootMargin:'0px 0px -8% 0px'});
  o.observe(f);})();
</script>
